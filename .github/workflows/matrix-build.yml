name: Native Build Matrix
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build target
        type: choice
        options: [all, android, ios, windows, macos]
        default: all
permissions:
  contents: read
jobs:
  detect-native-projects:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        env:
          SELECTED: ${{ inputs.platform }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          wanted = os.environ['SELECTED']
          specs = [
            ('android', 'native/android/gradlew', 'ubuntu-latest'),
            ('ios', 'native/ios/*.xcodeproj', 'macos-latest'),
            ('windows', 'native/windows/*.sln', 'windows-latest'),
            ('macos', 'native/macos/*.xcodeproj', 'macos-latest')
          ]
          rows = []
          for name, pattern, runner in specs:
            if list(pathlib.Path('.').glob(pattern)) and wanted in ('all', name):
              rows.append({'platform': name, 'runner': runner})
          print('matrix=' + json.dumps({'include': rows}))
          PY
  build:
    needs: detect-native-projects
    if: ${{ fromJson(needs.detect-native-projects.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-native-projects.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Native release integration contract
        run: echo "Native project found for ${{ matrix.platform }}. Add platform-specific signing/build steps and protected certificate secrets before release."
      - uses: actions/upload-artifact@v4
        with:
          name: native-project-${{ matrix.platform }}
          path: native/${{ matrix.platform }}/
          if-no-files-found: error
  no-native-source:
    needs: detect-native-projects
    if: ${{ fromJson(needs.detect-native-projects.outputs.matrix).include[0] == null }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "No native project source was found; no fake native binary will be generated."
