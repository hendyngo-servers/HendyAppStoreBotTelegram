name: Bootstrap complete source tree

on:
  push:
    branches: [bootstrap/full-source]
    paths:
      - '.bootstrap/**'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: bootstrap-full-source
  cancel-in-progress: false
jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: bootstrap/full-source
          persist-credentials: true
      - name: Check bootstrap payload
        id: gate
        shell: bash
        run: |
          if [[ -f .bootstrap/chunk-00.b64 ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore source archive
        if: steps.gate.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-*.b64 > /tmp/source.tar.xz.b64
          base64 --decode /tmp/source.tar.xz.b64 > /tmp/source.tar.xz
          mkdir -p /tmp/hendy-source
          tar -xJf /tmp/source.tar.xz -C /tmp/hendy-source
          rsync -a --exclude='.git/' --exclude='.github/workflows/***' /tmp/hendy-source/ ./
          rm -rf .bootstrap
      - name: Set up Node
        if: steps.gate.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source manifests, database, and feature tests
        if: steps.gate.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; const root = process.cwd(); let count = 0; const walk = d => { for (const e of fs.readdirSync(d, { withFileTypes: true })) { if (["node_modules", ".git", "dist"].includes(e.name)) continue; const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (e.name === "package.json") { JSON.parse(fs.readFileSync(p, "utf8")); count++; } } }; walk(root); for (const p of ["apps/mini-app/package.json", "apps/web-user/package.json", "apps/web-admin/package.json", "database/migrations/0008_feature_flags.sql", "workers/queue-processor/src/index.ts"]) if (!fs.existsSync(p)) throw new Error("Missing required source path: " + p); console.log("Manifest/source validation passed (" + count + " package.json files).");'
          python3 scripts/test_db.py
          node --test packages/feature-flags/test/*.test.js
      - name: Commit complete source tree
        if: steps.gate.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add complete source tree and advanced features"
          git push origin HEAD:bootstrap/full-source
      - name: Open pull request
        if: steps.gate.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head bootstrap/full-source \
            --title "feat: integrate advanced HendyAppStore features" \
            --body "Adds the consolidated app and worker monorepo, feature flags, queue processor, referral, daily check-in, notifications, admin feature toggles, module scaffolder, tests, and CI/CD workflows. Review external payment/bank providers and Cloudflare secrets before production."
