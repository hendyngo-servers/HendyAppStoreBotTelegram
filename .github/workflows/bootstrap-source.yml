name: Bootstrap complete source tree

on:
  push:
    branches: [bootstrap/full-source]
    paths:
      - '.bootstrap/**'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: bootstrap-full-source
  cancel-in-progress: false
jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: bootstrap/full-source
          persist-credentials: true
      - name: Check bootstrap payload
        id: gate
        shell: bash
        run: |
          if [[ -f .bootstrap/chunk-00.b64 ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore source archive
        if: steps.gate.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-*.b64 > /tmp/source.tar.xz.b64
          base64 --decode /tmp/source.tar.xz.b64 > /tmp/source.tar.xz
          mkdir -p /tmp/hendy-source
          tar -xJf /tmp/source.tar.xz -C /tmp/hendy-source
          rsync -a --exclude='.git/' --exclude='.github/workflows/***' /tmp/hendy-source/ ./
          rm -rf .bootstrap
      - name: Set up Node
        if: steps.gate.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate workspace and database
        if: steps.gate.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-workspace.js
          python3 scripts/test_db.py
          node --test packages/feature-flags/test/*.test.js
      - name: Commit complete source tree
        if: steps.gate.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add complete source tree and advanced features"
          git push origin HEAD:bootstrap/full-source
      - name: Open pull request
        if: steps.gate.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head bootstrap/full-source \
            --title "feat: integrate advanced HendyAppStore features" \
            --body "Adds the consolidated app and worker monorepo, feature flags, queue processor, referral, daily check-in, notifications, admin feature toggles, module scaffolder, tests, and CI/CD workflows. Review external payment/bank providers and Cloudflare secrets before production."
