name: Scaffold Feature Module
on:
  workflow_dispatch:
    inputs:
      feature_name:
        description: Lowercase slug (letters, digits, hyphens)
        required: true
        type: string
      target:
        description: Boilerplate target
        required: true
        type: choice
        options: [api, bot, component]
permissions:
  contents: write
  pull-requests: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate feature boilerplate
        env:
          FEATURE_NAME: ${{ inputs.feature_name }}
          TARGET: ${{ inputs.target }}
        run: node scripts/scaffold/generate-module.js "$FEATURE_NAME" "$TARGET"
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: scaffold/${{ inputs.feature_name }}
          delete-branch: true
          title: "chore(scaffold): add ${{ inputs.feature_name }} ${{ inputs.target }} module"
          commit-message: "chore(scaffold): add ${{ inputs.feature_name }} module"
          body: "Automated feature scaffold. Review generated code and tests before merging."
          base: main
